name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check-dist.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  meshes:
    name: Mesh export validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r scripts/requirements.txt
      - name: Export every gallery shape and reference shapes (STL, 3MF, GLB, OBJ, USDZ)
        run: npx tsx scripts/export-meshes.ts artifacts/meshes
      - name: Watertight, manifold, size and volume (trimesh)
        run: python scripts/validate_meshes.py artifacts/meshes
      - name: USDZ / AR Quick Look compliance (Pixar USD, ARKit rules)
        run: python scripts/validate_usdz.py artifacts/meshes
      - name: glTF validity (Khronos glTF-Validator)
        run: node scripts/validate-gltf.mjs artifacts/meshes
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: meshes
          path: artifacts/meshes
          retention-days: 7

  e2e:
    name: Browser tests (Playwright, software WebGL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            artifacts/screenshots
          retention-days: 7
